name: Deploy Shot Final public site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static website and original brand images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/assets _site/shot-final
          cp index.html _site/index.html
          cp shot-final/index.html _site/shot-final/index.html
          cp sitemap.xml _site/sitemap.xml
          cp robots.txt _site/robots.txt
          cp googleed1a60310cb8845f.html _site/googleed1a60310cb8845f.html
          base64 --decode assets/target-real.b64 > _site/assets/logo-shot-final-oficial.jpg
          base64 --decode assets/target.b64 > _site/assets/logo-shot-final-alto-contraste.png
          touch _site/.nojekyll

      - name: Verify logo search and portfolio navigation
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/index.html
          test -s _site/shot-final/index.html
          test -s _site/assets/logo-shot-final-oficial.jpg
          test -s _site/assets/logo-shot-final-alto-contraste.png
          test -s _site/sitemap.xml
          test -s _site/robots.txt
          test -s _site/googleed1a60310cb8845f.html
          # Both public HTML pages must be crawlable; /shot-final/ is the canonical URL.
          grep -Fq 'index, follow, max-image-preview:large' _site/index.html
          grep -Fq 'index, follow, max-image-preview:large' _site/shot-final/index.html
          ! grep -Eiq 'noindex|http-equiv=.refresh' _site/index.html _site/shot-final/index.html
          grep -Fq 'rel="canonical" href="https://edixteracosta-commits.github.io/shot-final-webar/shot-final/"' _site/index.html
          grep -Fq 'rel="canonical" href="https://edixteracosta-commits.github.io/shot-final-webar/shot-final/"' _site/shot-final/index.html
          grep -Fq 'logo-shot-final-oficial.jpg' _site/index.html
          grep -Fq 'logo-shot-final-alto-contraste.png' _site/index.html
          file _site/assets/logo-shot-final-oficial.jpg | grep -Fq 'JPEG image data'
          file _site/assets/logo-shot-final-alto-contraste.png | grep -Fq 'PNG image data'
          grep -Fq 'https://shotfinal44.pixieset.com/portafolio/' _site/shot-final/index.html
          grep -Fq 'https://www.instagram.com/somosshot.final/' _site/shot-final/index.html
          grep -Fq '"url": "https://shotfinal44.pixieset.com/portafolio/"' _site/shot-final/index.html
          grep -Fq 'logo-shot-final-oficial.jpg' _site/shot-final/index.html
          grep -Fq 'logo-shot-final-alto-contraste.png' _site/shot-final/index.html
          grep -Fq '<loc>https://edixteracosta-commits.github.io/shot-final-webar/shot-final/</loc>' _site/sitemap.xml
          grep -Fq 'Sitemap: https://edixteracosta-commits.github.io/shot-final-webar/sitemap.xml' _site/robots.txt
          if grep -Eiq 'mindar|aframe|ar-scene|activar cámara' _site/index.html _site/shot-final/index.html; then
            echo "Unexpected second-camera reference in public pages"
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
